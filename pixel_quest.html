const gcache={};
function glyph(ch,col){const k=ch+col;let g=gcache[k];if(g)return g;const rows=FONT[ch]||FONT['?'];g=document.createElement('canvas');g.width=6;g.height=8;const x=g.getContext('2d');x.fillStyle=col;for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(rows[j]&(16>>i))x.fillRect(i,j,1,1);gcache[k]=g;return g;}
function text(s,x,y,col='#fff',sc=1,sh='#000'){s=String(s).toUpperCase();for(let i=0;i<s.length;i++){const ch=s[i];if(ch===' ')continue;const px=Math.round(x+i*6*sc);if(sh)ctx.drawImage(glyph(ch,sh),px+sc,Math.round(y)+sc,6*sc,8*sc);ctx.drawImage(glyph(ch,col),px,Math.round(y),6*sc,8*sc);}}

function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    sfxG=AC.createGain();musG=AC.createGain();sfxG.connect(master);musG.connect(master);applyVol();startMusicLoop();}catch(e){AC=null;}
}
function applyVol(){if(!AC)return;sfxG.gain.value=settings.sfx;musG.gain.value=settings.music*0.55;}
function tone(f,dur,type,vol,f1,off,dest){if(!AC)return;off=off||0;dest=dest||sfxG;const t=AC.currentTime+off,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,vol,off,dest,lp){if(!AC)return;off=off||0;dest=dest||sfxG;lp=lp||6000;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=AC.currentTime+off,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*0.4);s.stop(t+dur+0.03);}

function arp(notes,dur,type,vol,gap){notes.forEach((m,i)=>tone(mf(m),dur,type,vol,0,i*gap));}

const mus={cur:null,step:0,next:0};
function setMusic(n){if(mus.cur===n)return;mus.cur=n;mus.step=0;mus.next=AC?AC.currentTime+0.08:0;}
function startMusicLoop(){setInterval(()=>{if(!AC||!mus.cur||!MUS[mus.cur])return;const tr=MUS[mus.cur],sd=60/tr.bpm/2;if(mus.next<AC.currentTime-0.4)mus.next=AC.currentTime+0.05;
  while(mus.next<AC.currentTime+0.2){playStep(tr,mus.step,mus.next);mus.step++;mus.next+=sd;}},30);}
function playStep(tr,s,t){
  const off=t-AC.currentTime,bar=Math.floor(s/8)%tr.prog.length,st=s%8,cr=tr.prog[bar],L=tr.sc.length;
  const nt=d=>tr.root+tr.sc[((d%L)+L)%L]+12*Math.floor(d/L);
  if(st%2===0)tone(mf(nt(cr-7+(st===4?4:0))),0.2,'triangle',0.2,0,off,musG);
  const ld=tr.lead[st];if(ld>=0)tone(mf(nt(cr+ld)),0.17,tr.lw,tr.lv,0,off,musG);
  if(tr.drum){if(st%4===0)tone(130,0.1,'sine',0.28,40,off,musG);if(st%2===1||tr.drum===2)noise(0.035,0.05,off,musG,9000);if(tr.drum===2&&st%4===2)noise(0.08,0.12,off,musG,3000);}
}

/* ===================== INPUT (Keyboard + Xbox 360 pad) ===================== */
const KEYMAP={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],a:['KeyJ','KeyZ','Space'],b:['KeyK','KeyX','ShiftLeft','ShiftRight'],x:['KeyL','KeyC'],y:['KeyI','KeyV'],start:['Enter','Escape','KeyP']};
const BN=['left','right','up','down','a','b','x','y','start'];
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;initAudio();if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Tab')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('mousedown',()=>initAudio());
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(G.state==='playing')pauseGame();});
addEventListener('gamepadconnected',e=>{toast('CONTROLLER CONNECTED');});
addEventListener('gamepaddisconnected',e=>{toast('CONTROLLER DISCONNECTED');});
const IN={cur:{},prev:{},ax:0,ay:0,pad:null,hold:{},rep:{},rt:{}};
function pollInput(dt){
  IN.prev=IN.cur;const c={};
  for(const n of BN)c[n]=KEYMAP[n].some(k=>keys[k]);
  let ax=(c.right?1:0)-(c.left?1:0),ay=(c.down?1:0)-(c.up?1:0);
  let pad=null;
  try{const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps){if(p&&p.connected){pad=p;break;}}}catch(e){}
  IN.pad=pad;
  if(pad){
    const B=i=>!!(pad.buttons[i]&&(pad.buttons[i].pressed||pad.buttons[i].value>0.5));
    if(B(0)||B(7))c.a=true;if(B(1)||B(6))c.b=true;if(B(2)||B(4))c.x=true;if(B(3)||B(5))c.y=true;if(B(9))c.start=true;
    const sx=pad.axes[0]||0,sy=pad.axes[1]||0,m=Math.hypot(sx,sy);
    if(m>0.26){const k=Math.min(1,(m-0.26)/0.62)/m;ax=sx*k;ay=sy*k;}
    if(B(12))ay=-1;if(B(13))ay=1;if(B(14))ax=-1;if(B(15))ax=1;
  }
  const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;}
  IN.ax=ax;IN.ay=ay;
  if(ax<-0.5)c.left=true;if(ax>0.5)c.right=true;if(ay<-0.5)c.up=true;if(ay>0.5)c.down=true;
  IN.cur=c;
  for(const n of ['left','right','up','down']){if(c[n]){IN.hold[n]=(IN.hold[n]||0)+dt;IN.rep[n]=false;if(IN.hold[n]>0.4){IN.rt[n]=(IN.rt[n]||0)+dt;if(IN.rt[n]>0.1){IN.rt[n]=0;IN.rep[n]=true;}}}else{IN.hold[n]=0;IN.rt[n]=0;IN.rep[n]=false;}}
}
const pr=n=>!!(IN.cur[n]&&!IN.prev[n]),dn=n=>!!IN.cur[n],rp=n=>pr(n)||!!IN.rep[n];
function rumble(ms,strong,weak){const p=IN.pad;if(p&&p.vibrationActuator&&p.vibrationActuator.playEffect){try{p.vibrationActuator.playEffect('dual-rumble',{startDelay:0,duration:ms,weakMagnitude:weak,strongMagnitude:strong});}catch(e){}}}

function spr(rows,pal){const w=Math.max(...rows.map(r=>r.length)),h=rows.length;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}});return c;}
function flashOf(c){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return o;}
function drawSpr(c,x,y,flip){x=Math.round(x);y=Math.round(y);if(flip){ctx.save();ctx.translate(x+c.width,y);ctx.scale(-1,1);ctx.drawImage(c,0,0);ctx.restore();}else ctx.drawImage(c,x,y);}

function genArea(i){
  const d=AREAS[i],r=mulberry32(d.seed*977+13),m=new Uint8Array(MW*MH).fill(d.ground);
  const set=(x,y,t)=>{if(x>=0&&y>=0&&x<MW&&y<MH)m[y*MW+x]=t;};
  const get=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?d.wall:m[y*MW+x];
  const last=i===AREAS.length-1,leftRow=i>0?PORT[i-1]:PORT[0],rightRow=PORT[i];
  const pt=d.ground===TL.GRASS?TL.PATH:d.ground;
  const signs=[],chests=[];let crack=null;
  for(let k=0;k<d.blobs;k++){const water=r()<d.water,cx=2+r()*(MW-4),cy=2+r()*(MH-4),rad=(1+r()*2.4)*(water?1.4:1),t=water?TL.WATER:d.obst;
    for(let y=Math.floor(cy-rad-1);y<=cy+rad+1;y++)for(let x=Math.floor(cx-rad-1);x<=cx+rad+1;x++)if(Math.hypot((x-cx)*0.9,y-cy)<rad)set(x,y,t);}
  const spot=(tile,n)=>{for(let k=0;k<n;k++){const x=3+Math.floor(r()*(MW-6)),y=3+Math.floor(r()*(MH-6));if(m[y*MW+x]===d.ground)set(x,y,tile);}};
  if(d.decor.bush)spot(TL.BUSH,d.decor.bush);if(d.decor.pot)spot(TL.POT,d.decor.pot);if(d.decor.flower)spot(TL.FLOWER,d.decor.flower);
  for(let x=0;x<MW;x++){for(const y of [0,1,MH-2,MH-1])set(x,y,d.wall);if(r()<0.5)set(x,2,d.wall);if(r()<0.5)set(x,MH-3,d.wall);}
  for(let y=0;y<MH;y++){for(const x of [0,1,MW-2,MW-1])set(x,y,d.wall);if(r()<0.5)set(2,y,d.wall);if(r()<0.5)set(MW-3,y,d.wall);}
  if(i>0)for(let y=leftRow-1;y<=leftRow+1;y++)for(let x=0;x<4;x++)set(x,y,pt);
  if(!last)for(let y=rightRow-1;y<=rightRow+1;y++)for(let x=MW-4;x<MW;x++)set(x,y,pt);
  if(d.village){
    for(let y=3;y<=13;y++)for(let x=3;x<=MW-4;x++)set(x,y,TL.GRASS);
    const house=(x0,y0,w,door)=>{for(let x=x0;x<x0+w;x++){set(x,y0,TL.ROOF);set(x,y0+1,TL.ROOF);set(x,y0+2,TL.HOUSE);}set(x0+door,y0+2,TL.DOOR);};
    house(6,5,5,2);house(16,4,6,3);house(29,6,5,2);
    for(let k=0;k<26;k++){const x=4+((r()*(MW-8))|0),y=10+((r()*3)|0);if(get(x,y)===TL.GRASS)set(x,y,TL.FLOWER);}
    for(const [x,y] of [[4,4],[13,5],[25,5],[35,5],[37,10],[3,10],[13,10],[22,12]])set(x,y,TL.TREE);
    for(const [x,y] of [[12,8],[14,9],[27,9],[24,11]])set(x,y,TL.BUSH);
    for(let x=27;x<=31;x++)set(x,12,TL.FENCE);
    set(4,13,TL.SIGN);signs.push({tx:4,ty:13,text:'WILLOWBROOK VILLAGE. EAST: THE WHISPERING FOREST. HOLD A TO SPIN!'});
  }
  const path=[];
  for(let x=0;x<MW;x++){const t=x/(MW-1);let y=leftRow+(rightRow-leftRow)*t+Math.sin(x*0.38+d.seed)*2.6*Math.sin(Math.PI*t);path.push(clamp(Math.round(y),10,20));}
  const top=(i%2===0),pcx=7+Math.floor(r()*(MW-16)),pcy=top?5:25;
  for(let y=pcy-2;y<=pcy+2;y++)for(let x=pcx-2;x<=pcx+2;x++)set(x,y,d.wall);
  for(let y=pcy-1;y<=pcy+1;y++)for(let x=pcx-1;x<=pcx+1;x++)set(x,y,d.ground);
  const cty=top?pcy+2:pcy-2;set(pcx,cty,TL.CRACK);set(pcx,pcy,TL.CHEST);
  crack={tx:pcx,ty:cty,key:i+'s'};chests.push({tx:pcx,ty:pcy,key:i+'s',loot:d.secret,secret:true});
  {let py=path[0];for(let x=(i>0?0:2);x<=(last?MW-3:MW-1);x++){const y=path[x],a=Math.min(py,y)-1,b=Math.max(py,y)+1;for(let yy=a;yy<=b;yy++)set(x,yy,pt);py=y;}}
  if(top){for(let yy=pcy+3;yy<=path[pcx];yy++)set(pcx,yy,d.ground);}else{for(let yy=path[pcx];yy<=pcy-3;yy++)set(pcx,yy,d.ground);}
  for(let tries=0;tries<80;tries++){const px=8+((r()*(last?16:24))|0),side=r()<0.5?-1:1,cyy=path[px]+side*4;if(Math.abs(px-pcx)<=4||cyy<6||cyy>24)continue;
    for(let y=cyy-1;y<=cyy+1;y++)for(let x=px-1;x<=px+1;x++)set(x,y,d.ground);
    for(let yy=Math.min(path[px],cyy);yy<=Math.max(path[px],cyy);yy++)set(px,yy,d.ground);
    set(px,cyy,TL.CHEST);chests.push({tx:px,ty:cyy,key:i+'c',loot:d.chest});break;}
  if(last){for(let y=8;y<=21;y++)for(let x=27;x<=37;x++)set(x,y,TL.DFLOOR);for(const [x,y] of [[28,9],[36,9],[28,20],[36,20],[32,9],[32,20]])set(x,y,TL.PILLAR);}
  const npcs=[];
  for(const n of d.npcs||[]){const ty=n.ty!==undefined?n.ty:path[n.tx]+n.dy;for(let y=ty-1;y<=ty+1;y++)for(let x=n.tx-1;x<=n.tx+1;x++)if(!SOLID.has(get(x,y))||true)if(x>2&&y>2&&x<MW-3&&y<MH-3&&!(d.village&&get(x,y)>=TL.HOUSE&&get(x,y)<=TL.DOOR))set(x,y,d.ground===TL.GRASS&&!d.village?TL.GRASS:(get(x,y)===TL.PATH?TL.PATH:d.ground));npcs.push(Object.assign({},n,{ty}));}
  for(let y=leftRow-1;y<=leftRow+1;y++)for(let x=2;x<=5;x++)set(x,y,pt);
  for(const c of chests)if(F.chests[c.key])set(c.tx,c.ty,TL.CHESTO);
  if(F.secrets[crack.key])set(crack.tx,crack.ty,d.ground);
  return{map:m,chests,crack,signs,npcs,leftRow,rightRow,path,
    spawnL:{x:3*TS+8,y:leftRow*TS+8},spawnR:{x:(MW-4)*TS+8,y:rightRow*TS+8}};
}

function makeEnemy(type,x,y){const b=ET[type];return Object.assign({type,x,y,hp:b.hp,maxhp:b.hp,hw:b.hw,hh:b.hh,spd:b.spd,dmg:b.dmg,xp:b.xp,fly:!!b.fly,kx:0,ky:0,flash:0,stun:0,t:rr(0,1),st:'wait',ph:rr(0,6),dx:0,dy:0,dead:false,face:1,theme:ar?ar.def.theme:0},{});}
function solidAt(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return true;return SOLID.has(ar.map[ty*MW+tx]);}
function collides(e){const x0=Math.floor((e.x-e.hw)/TS),x1=Math.floor((e.x+e.hw-0.01)/TS),y0=Math.floor((e.y-e.hh)/TS),y1=Math.floor((e.y+e.hh-0.01)/TS);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(solidAt(x,y))return true;
  if(e===pl){for(const n of ar.npcs)if(Math.abs(e.x-n.x)<e.hw+5&&Math.abs(e.y-n.y)<e.hh+4)return true;}
  return false;}
function moveAxis(e,d,axis){const n=Math.ceil(Math.abs(d));if(!n)return false;const s=d/n;for(let i=0;i<n;i++){e[axis]+=s;if(collides(e)){e[axis]-=s;return true;}}return false;}
function step(e,vx,vy,dt){if(e.fly){e.x+=vx*dt;e.y+=vy*dt;return false;}const a=moveAxis(e,vx*dt,'x'),b=moveAxis(e,vy*dt,'y');return a||b;}
function pickSpot(minD){for(let k=0;k<300;k++){const tx=4+((Math.random()*(MW-8))|0),ty=4+((Math.random()*(MH-8))|0);if(ar.def.boss&&tx>=26)continue;let ok=true;
  for(let dy=-1;dy<=1&&ok;dy++)for(let dx=-1;dx<=1;dx++)if(SOLID.has(ar.map[(ty+dy)*MW+tx+dx])){ok=false;break;}
  if(!ok)continue;const x=tx*TS+8,y=ty*TS+8;if(Math.hypot(x-pl.x,y-pl.y)<minD)continue;return{x,y};}return null;}
function startArea(i,side){
  const wd=worlds[i]||(worlds[i]=genArea(i)),def=AREAS[i];
  ar={i,def,wd,map:wd.map,enemies:[],pickups:[],projs:[],bombs:[],parts:[],pops:[],npcs:[],boss:null,bossOn:false,t:0,banner:3.2};
  for(const n of wd.npcs)ar.npcs.push({n:n.n,x:n.tx*TS+8,y:n.ty*TS+8,col:n.col,hair:n.hair,hat:n.hat,beard:n.beard,shop:n.shop,lines:n.lines});
  const sp=side==='R'?wd.spawnR:wd.spawnL;pl.x=sp.x;pl.y=sp.y;pl.kx=pl.ky=0;pl.dash=0;pl.spin=0;pl.atk=0;pl.holdA=false;pl.charge=0;pl.ready=false;
  if(side==='R'){pl.face=2;pl.fx=-1;pl.fy=0;}else{pl.face=3;pl.fx=1;pl.fy=0;}
  if(def.count){const tot=def.enemies.reduce((a,b)=>a+b[1],0);for(let k=0;k<def.count;k++){let q=Math.random()*tot,ty=def.enemies[0][0];for(const [n,w] of def.enemies){if((q-=w)<=0){ty=n;break;}}const s=pickSpot(110);if(s)ar.enemies.push(makeEnemy(ty,s.x,s.y));}}
  if(def.boss&&!F.boss){const b=makeEnemy('boss',33*TS+8,14*TS+8);b.on=false;b.st='idle';b.t=1.5;b.fire=0;b.n=0;ar.boss=b;ar.enemies.push(b);}
  setMusic(def.music);updateCam(true);
  if(pl.hp>0&&G.state!=='title')saveGame(true);
}
function goArea(i,side){if(G.fade)return;G.fade={t:0,mode:'out',cb:()=>startArea(i,side)};}
function updateCam(snap){cam.x=clamp(Math.round(pl.x-VW/2),0,MW*TS-VW);cam.y=clamp(Math.round(pl.y-VH/2),0,MH*TS-VH);}

/* ===================== EFFECTS / PICKUPS ===================== */
function burst(x,y,n,col,spd,life,g){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rr(0.3,1)*spd;ar.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*rr(0.6,1),max:life,col,sz:Math.random()<0.4?2:1,g:g||0});}}
function popup(x,y,t,col){ar.pops.push({x,y,t,col,life:0.8});}
function pickup(type,x,y){ar.pickups.push({type,x,y,z:0,vz:rr(60,100),vx:rr(-20,20),vy:rr(-20,20),t:0,life:12});}
function dropLoot(x,y){const r=Math.random();if(r<0.5)pickup('coin',x,y);if(r<0.2)pickup('coin',x,y);if(r>0.5&&r<0.6)pickup('heart',x,y);else if(r>0.6&&r<0.67)pickup('bomb',x,y);else if(r>0.67&&r<0.71)pickup('bigcoin',x,y);}
function gainXp(n){pl.xp+=n;while(pl.lvl<20&&pl.xp>=xpNeed(pl.lvl)){pl.xp-=xpNeed(pl.lvl);pl.lvl++;pl.hp=pl.maxhp;toast('LEVEL UP! LV '+pl.lvl);sfx('level');burst(pl.x,pl.y-6,24,'#ffe04a',90,0.8);}}
function giveLoot(l){switch(l.t){
 case 'coins':pl.coins+=l.n;toast('GOT '+l.n+' COINS!');break;
 case 'heart':pl.maxhp=Math.min(24,pl.maxhp+2);pl.hp=pl.maxhp;toast('HEART CONTAINER! MAX HP UP!');break;
 case 'sword':pl.sword++;toast('SWORD UPGRADED! ATTACK UP!');break;
 case 'boots':pl.boots=true;toast('SPEED BOOTS! FASTER DASH!');break;
 case 'potion':pl.potions=Math.min(9,pl.potions+l.n);toast('GOT '+l.n+' POTIONS!');break;
 case 'bombs':pl.bombs=Math.min(30,pl.bombs+l.n);toast('GOT '+l.n+' BOMBS!');break;}}
function openChest(tx,ty){const c=ar.wd.chests.find(c=>c.tx===tx&&c.ty===ty);if(!c||F.chests[c.key])return;F.chests[c.key]=true;ar.map[ty*MW+tx]=TL.CHESTO;sfx('chest');rumble(300,0.5,0.9);burst(tx*TS+8,ty*TS+6,18,'#ffe04a',80,0.7);giveLoot(c.loot);}
function openCrack(tx,ty){const c=ar.wd.crack;if(!c||c.tx!==tx||c.ty!==ty||F.secrets[c.key])return;F.secrets[c.key]=true;ar.map[ty*MW+tx]=ar.def.ground;sfx('secret');shake(5);rumble(400,1,0.4);burst(tx*TS+8,ty*TS+8,20,'#b8a890',80,0.7);toast('A SECRET PASSAGE OPENS!');}
function breakTile(tx,ty){ar.map[ty*MW+tx]=ar.def.ground;burst(tx*TS+8,ty*TS+8,10,ar.def.theme<2?'#38a043':'#c0703a',70,0.5,200);sfx('ouch');if(Math.random()<0.55)dropLoot(tx*TS+8,ty*TS+8);}
function swordTile(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return;const t=ar.map[ty*MW+tx];
  if(BREAK.has(t))breakTile(tx,ty);else if(t===TL.CHEST)openChest(tx,ty);
  else if(t===TL.SIGN){const s=ar.wd.signs.find(s=>s.tx===tx&&s.ty===ty);if(s)say([s.text],'SIGN');}
  else if(t===TL.CRACK){sfx('tink');toast('THE BOULDER SOUNDS HOLLOW...');}}

/* ===================== COMBAT ===================== */
function hurtEnemy(e,dmg,dx,dy){
  e.hp-=dmg;e.flash=0.12;sfx('hit');G.hitstop=0.045;shake(2);rumble(80,0.3,0.5);
  if(e.type!=='boss'){e.kx=dx*120;e.ky=dy*120;e.stun=0.18;}
  burst(e.x,e.y-2,6,'#fff',70,0.3);popup(e.x,e.y-e.hh-6,String(dmg),'#fff');
  if(e.hp<=0&&!e.dead){e.dead=true;G.kills++;gainXp(e.xp);
    if(e.type==='boss'){sfx('bossdie');shake(14);rumble(800,1,1);ar.bossDying=2;ar.bossX=e.x;ar.bossY=e.y;F.boss=true;setMusic(ar.def.music);ar.bossOn=false;}
    else{sfx('kill');burst(e.x,e.y,14,e.type==='slime'?SLPAL[e.theme].l:'#c8c0d8',80,0.5);dropLoot(e.x,e.y);}}}
function hurtPlayer(d,fx,fy){if(pl.inv>0||pl.dash>0||pl.hp<=0)return;pl.hp-=d;pl.inv=1.1;pl.flash=0.35;const a=Math.atan2(pl.y-fy,pl.x-fx);pl.kx=Math.cos(a)*150;pl.ky=Math.sin(a)*150;pl.atk=0;pl.holdA=false;pl.charge=0;pl.ready=false;
  shake(5);G.hitstop=0.07;sfx('hurt');rumble(220,0.9,0.7);burst(pl.x,pl.y-4,8,'#ff4050',60,0.4);popup(pl.x,pl.y-14,'-'+d,'#ff6070');
  if(pl.hp<=0){pl.hp=0;die();}}
function die(){pl.dead=true;G.state='gameover';G.goT=0;G.menu=null;setMusic(null);sfx('die');}
function swordHit(ang,spin){const dmg=Math.ceil(atkDmg()*(spin?1.5:1)),len=spin?25:22;
  for(let r=6;r<=len;r+=4){const px=pl.x+Math.cos(ang)*r,py=pl.y-3+Math.sin(ang)*r;
    for(const e of ar.enemies){if(e.dead||pl.hitSet.has(e))continue;if(e.type==='boss'&&!e.on)continue;if(Math.abs(px-e.x)<e.hw+3&&Math.abs(py-e.y)<e.hh+3){pl.hitSet.add(e);hurtEnemy(e,dmg,Math.cos(ang),Math.sin(ang));}}
    const tx=Math.floor(px/TS),ty=Math.floor(py/TS),key=ty*MW+tx;if(!pl.hitTiles.has(key)){pl.hitTiles.add(key);swordTile(tx,ty);}}}
function explode(b){sfx('boom');shake(10);rumble(500,1,0.6);G.hitstop=0.05;
  for(let i=0;i<30;i++){const a=Math.random()*6.283,s=rr(20,110);ar.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rr(0.3,0.7),max:0.7,col:['#ffe04a','#ff8a2a','#e8333f','#fff'][i%4],sz:2,g:0});}
  ar.flashT=0.12;
  for(const e of ar.enemies){if(e.dead||(e.type==='boss'&&!e.on))continue;if(Math.hypot(e.x-b.x,e.y-b.y)<34){const a=Math.atan2(e.y-b.y,e.x-b.x);hurtEnemy(e,3+Math.floor(pl.lvl/4),Math.cos(a),Math.sin(a));}}
  if(Math.hypot(pl.x-b.x,pl.y-b.y)<28)hurtPlayer(2,b.x,b.y);
  const r=2;const cx=Math.floor(b.x/TS),cy=Math.floor(b.y/TS);
  for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){if(x<0||y<0||x>=MW||y>=MH)continue;if(Math.hypot(x*TS+8-b.x,y*TS+8-b.y)>36)continue;const t=ar.map[y*MW+x];if(BREAK.has(t))breakTile(x,y);else if(t===TL.CRACK)openCrack(x,y);}}

/* ===================== ENEMY AI ===================== */
const AI={};
AI.slime=(e,dt)=>{e.t-=dt;if(e.st==='wait'){if(e.t<=0){e.st='hop';e.t=0.45;const d=dist(e,pl),a=d<95?Math.atan2(pl.y-e.y,pl.x-e.x):Math.random()*6.283;e.dx=Math.cos(a);e.dy=Math.sin(a);}}
  else{step(e,e.dx*e.spd*1.9,e.dy*e.spd*1.9,dt);if(e.t<=0){e.st='wait';e.t=rr(0.5,1.2);}}};
AI.bat=(e,dt)=>{e.ph+=dt*9;const d=dist(e,pl);let a;if(d<120){a=Math.atan2(pl.y-e.y,pl.x-e.x)+Math.sin(e.ph*0.5)*0.9;}else{e.t-=dt;if(e.t<=0){e.dx=rr(0,6.283);e.t=rr(0.6,1.4);}a=e.dx;}
  step(e,Math.cos(a)*e.spd,Math.sin(a)*e.spd+Math.sin(e.ph)*18,dt);e.x=clamp(e.x,36,MW*TS-36);e.y=clamp(e.y,36,MH*TS-36);};
AI.skel=(e,dt)=>{const d=dist(e,pl),a=Math.atan2(pl.y-e.y,pl.x-e.x);e.face=pl.x<e.x?-1:1;
  if(d<140){const w=d>66?1:d<46?-0.7:0;e.ph+=dt*2;step(e,Math.cos(a)*e.spd*w-Math.sin(a)*Math.sin(e.ph)*14,Math.sin(a)*e.spd*w+Math.cos(a)*Math.sin(e.ph)*14,dt);
    e.t-=dt;if(e.t<=0){e.t=rr(1.8,2.8);ar.projs.push({x:e.x,y:e.y-3,vx:Math.cos(a)*78,vy:Math.sin(a)*78,r:3,dmg:1,life:2.5,kind:'bone',ph:0});sfx('blip');}}
  else{e.t-=dt;if(e.t<=0){e.dx=rr(0,6.283);e.t=rr(1,2);}if(Math.random()<0.3)step(e,Math.cos(e.dx)*e.spd*0.5,Math.sin(e.dx)*e.spd*0.5,dt);}};
AI.scorp=(e,dt)=>{const d=dist(e,pl),a=Math.atan2(pl.y-e.y,pl.x-e.x);e.t-=dt;e.face=Math.cos(a)<0?-1:1;
  if(e.st==='wait'||e.st==='idle'){e.st='idle';if(d<100&&e.t<=0){e.st='wind';e.t=0.4;e.dx=Math.cos(a);e.dy=Math.sin(a);}else{if(e.t<=0){e.dx=rr(0,6.283);e.t=rr(0.8,1.6);}step(e,Math.cos(e.dx)*e.spd*0.5,Math.sin(e.dx)*e.spd*0.5,dt);}}
  else if(e.st==='wind'){if(e.t<=0){e.st='dash';e.t=0.32;e.dx=Math.cos(a);e.dy=Math.sin(a);}}
  else if(e.st==='dash'){step(e,e.dx*135,e.dy*135,dt);if(e.t<=0){e.st='rest';e.t=0.7;}}
  else if(e.st==='rest'){if(e.t<=0){e.st='idle';e.t=0.3;}}};
AI.boss=(e,dt)=>{
  if(!e.on){if(pl.x>26*TS){e.on=true;ar.bossOn=true;setMusic('boss');sfx('roar');shake(10);rumble(700,1,0.6);toast('ZORATH AWAKENS!');}else return;}
  e.t-=dt;const a=Math.atan2(pl.y-e.y,pl.x-e.x),d=dist(e,pl),rage=e.hp<e.maxhp*0.5,sp=e.spd*(rage?1.5:1);
  if(e.st==='idle'){if(d>36)step(e,Math.cos(a)*sp,Math.sin(a)*sp,dt);
    if(e.t<=0){const o=['wind','burst','spiral'];if(rage)o.push('summon','wind');e.st=o[(Math.random()*o.length)|0];e.t=e.st==='wind'?0.7:e.st==='spiral'?1.9:0.5;e.n=0;e.fire=0;}}
  else if(e.st==='wind'){if(e.t<=0){e.st='charge';e.t=0.9;e.dx=Math.cos(a);e.dy=Math.sin(a);}}
  else if(e.st==='charge'){const hit=step(e,e.dx*(rage?190:160),e.dy*(rage?190:160),dt);if(hit||e.t<=0){e.st='idle';e.t=1.0;if(hit)shake(5);}}
  else if(e.st==='burst'){if(!e.n&&e.t<=0.25){e.n=1;const k=rage?16:12,o=Math.random()*6.283;for(let i=0;i<k;i++){const q=o+i*6.283/k;ar.projs.push({x:e.x,y:e.y,vx:Math.cos(q)*70,vy:Math.sin(q)*70,r:4,dmg:1,life:4,kind:'orb',ph:0});}sfx('roar');}
    if(e.t<=0){e.st='idle';e.t=rage?0.9:1.4;}}
  else if(e.st==='spiral'){e.fire-=dt;if(e.fire<=0){e.fire=rage?0.09:0.14;e.n+=0.55;ar.projs.push({x:e.x,y:e.y,vx:Math.cos(e.n)*85,vy:Math.sin(e.n)*85,r:4,dmg:1,life:4,kind:'orb',ph:0});sfx('blip');}if(e.t<=0){e.st='idle';e.t=1.0;}}
  else if(e.st==='summon'){if(e.t<=0){const alive=ar.enemies.filter(q=>!q.dead&&q.type!=='boss').length;if(alive<4)for(let k=0;k<2;k++){const s=makeEnemy('slime',e.x+(k?26:-26),e.y+14);s.theme=3;if(!collides(s))ar.enemies.push(s);}burst(e.x,e.y,20,'#c040ff',80,0.6);sfx('roar');e.st='idle';e.t=1.2;}}
};
function updateEnemy(e,dt){
  if(e.flash>0)e.flash-=dt;
  if(e.kx||e.ky){if(e.fly){e.x+=e.kx*dt;e.y+=e.ky*dt;}else{moveAxis(e,e.kx*dt,'x');moveAxis(e,e.ky*dt,'y');}const k=Math.max(0,1-dt*7);e.kx*=k;e.ky*=k;if(Math.abs(e.kx)<2)e.kx=0;if(Math.abs(e.ky)<2)e.ky=0;}
  if(e.stun>0)e.stun-=dt;else if(!e.dead)AI[e.type](e,dt);
  if(e.type==='boss'&&!e.on)return;
  if(!e.dead&&Math.abs(e.x-pl.x)<e.hw+pl.hw&&Math.abs(e.y-pl.y)<e.hh+pl.hh+2)hurtPlayer(e.dmg,e.x,e.y);}

/* ===================== PLAYER ===================== */
function nearNpc(){for(const n of ar.npcs){if(Math.hypot(n.x-pl.x,n.y-pl.y)<24)return n;}return null;}
function say(lines,name,after){G.dlg={lines,i:0,ch:0,name:name||'',after};G.state='dialog';}
function talk(n){if(n.shop)say(n.lines,n.n,openShop);else say(n.lines,n.n);sfx('select');}
function startSwing(){pl.atk=0.22;pl.ba=Math.atan2(pl.fy,pl.fx);pl.hitSet=new Set();pl.hitTiles=new Set();sfx('sword');}
function startSpin(){pl.spin=0.36;pl.atk=0;pl.ba=Math.atan2(pl.fy,pl.fx);pl.hitSet=new Set();pl.hitTiles=new Set();sfx('spin');rumble(200,0.3,0.6);}
function updatePlayer(dt){
  const p=pl;for(const k of ['inv','flash','dashCd','atk','spin','dash'])if(p[k]>0)p[k]=Math.max(0,p[k]-dt);
  if(pr('a')){const n=nearNpc();if(n&&p.dash<=0){talk(n);return;}if(p.atk<=0&&p.spin<=0)startSwing();p.holdA=true;p.charge=0;p.ready=false;}
  if(p.holdA){if(dn('a')){p.charge+=dt;if(p.charge>=0.55&&!p.ready){p.ready=true;sfx('ready');}}else{if(p.ready&&p.spin<=0)startSpin();p.holdA=false;p.ready=false;p.charge=0;}}
  if(pr('b')&&p.dashCd<=0&&p.dash<=0){let dx=IN.ax,dy=IN.ay;if(!dx&&!dy){dx=p.fx;dy=p.fy;}const m=Math.hypot(dx,dy)||1;p.dx=dx/m;p.dy=dy/m;p.dash=0.16;p.dashCd=p.boots?0.35:0.6;p.inv=Math.max(p.inv,0.18);sfx('dash');burst(p.x,p.y,6,'#fff',40,0.3);}
  if(pr('x')){if(p.potions>0&&p.hp<p.maxhp){p.potions--;p.hp=Math.min(p.maxhp,p.hp+4);sfx('potion');burst(p.x,p.y-4,16,'#60ff80',70,0.6);popup(p.x,p.y-14,'+HP','#60ff80');}else sfx('error');}
  if(pr('y')){if(p.bombs>0&&ar.bombs.length<3){p.bombs--;ar.bombs.push({x:p.x+p.fx*12,y:p.y+p.fy*12,t:1.3});sfx('bomb');}else sfx('error');}
  let mx=0,my=0;const ax=IN.ax,ay=IN.ay;p.moving=!!(ax||ay);
  if(p.dash>0){const s=p.boots?220:180;mx=p.dx*s;my=p.dy*s;if(Math.random()<0.7)ar.parts.push({x:p.x,y:p.y-3,vx:0,vy:0,life:0.2,max:0.2,col:'#bfe0ff',sz:2,g:0});}
  else{const sp=70*(p.holdA&&p.charge>0.2?0.55:1)*(p.atk>0?0.65:1)*(p.spin>0?0.4:1);mx=ax*sp;my=ay*sp;
    if(p.moving&&p.atk<=0&&p.spin<=0&&!p.holdA){if(Math.abs(ax)>Math.abs(ay)){p.face=ax<0?2:3;p.fx=ax<0?-1:1;p.fy=0;}else{p.face=ay<0?1:0;p.fx=0;p.fy=ay<0?-1:1;}}
    else if(p.moving&&p.holdA&&p.atk<=0&&p.spin<=0){if(Math.abs(ax)>Math.abs(ay)){p.face=ax<0?2:3;p.fx=ax<0?-1:1;p.fy=0;}else{p.face=ay<0?1:0;p.fx=0;p.fy=ay<0?-1:1;}}}
  if(p.kx||p.ky){mx+=p.kx;my+=p.ky;const k=Math.max(0,1-dt*8);p.kx*=k;p.ky*=k;if(Math.abs(p.kx)<2)p.kx=0;if(Math.abs(p.ky)<2)p.ky=0;}
  moveAxis(p,mx*dt,'x');moveAxis(p,my*dt,'y');
  if(p.moving)p.wt+=dt*(p.dash>0?0:1);
  if(p.atk>0){const u=1-p.atk/0.22;p.bang=p.ba-1.3+2.6*u;if(u>0.1&&u<0.95)swordHit(p.bang,false);}
  if(p.spin>0){const u=1-p.spin/0.36;p.bang=p.ba+u*Math.PI*2;swordHit(p.bang,true);}
}

/* ===================== UPDATE ===================== */
function updateWorld(dt){
  ar.t+=dt;G.time+=dt;if(ar.banner>0)ar.banner-=dt;if(ar.flashT>0)ar.flashT-=dt;
  updatePlayer(dt);if(G.state!=='playing')return;
  for(const e of ar.enemies)updateEnemy(e,dt);
  ar.enemies=ar.enemies.filter(e=>!(e.dead&&e.type!=='boss')||false);
  if(ar.boss&&ar.boss.dead){ar.enemies=ar.enemies.filter(e=>e!==ar.boss);const b=ar.boss;ar.boss=null;ar.bossDeadAt={x:b.x,y:b.y};}
  if(ar.bossDying>0){ar.bossDying-=dt;if(Math.random()<0.6)burst(ar.bossX+rr(-14,14),ar.bossY+rr(-12,10),6,['#ffe04a','#ff8a2a','#c040ff'][ri(0,2)],80,0.6);if(Math.random()<0.15){sfx('boom');shake(6);}
    if(ar.bossDying<=0){ar.pickups.push({type:'crystal',x:ar.bossX,y:ar.bossY,z:6,vz:0,vx:0,vy:0,t:0,life:9999});toast('THE CRYSTAL APPEARS!');}}
  for(const b of ar.bombs){b.t-=dt;if(b.t<=0){b.dead=true;explode(b);}}ar.bombs=ar.bombs.filter(b=>!b.dead);
  for(const q of ar.projs){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.ph+=dt*10;if(solidAt(Math.floor(q.x/TS),Math.floor(q.y/TS)))q.life=0;
    if(Math.abs(q.x-pl.x)<q.r+pl.hw&&Math.abs(q.y-(pl.y-3))<q.r+pl.hh+2){if(pl.inv<=0&&pl.dash<=0){hurtPlayer(q.dmg,q.x,q.y);q.life=0;}}}
  ar.projs=ar.projs.filter(q=>q.life>0);
  for(const k of ar.pickups){k.t+=dt;k.life-=dt;if(k.type!=='crystal'){k.z+=k.vz*dt;k.vz-=260*dt;if(k.z<=0){k.z=0;k.vz=Math.abs(k.vz)>25?-k.vz*0.45:0;k.vx*=0.5;k.vy*=0.5;}
      const nx=k.x+k.vx*dt,ny=k.y+k.vy*dt;if(!solidAt(Math.floor(nx/TS),Math.floor(ny/TS))){k.x=nx;k.y=ny;}
      const d=Math.hypot(pl.x-k.x,pl.y-k.y);if((k.type==='coin'||k.type==='bigcoin')&&d<30&&k.z<4){k.x+=(pl.x-k.x)*dt*6;k.y+=(pl.y-k.y)*dt*6;}}
    const d2=Math.hypot(pl.x-k.x,pl.y-3-k.y);
    if(d2<(k.type==='crystal'?14:9)&&k.z<8){k.life=0;
      if(k.type==='coin'){pl.coins++;sfx('coin');}else if(k.type==='bigcoin'){pl.coins+=5;sfx('coin');popup(pl.x,pl.y-14,'+5','#60c0ff');}
      else if(k.type==='heart'){pl.hp=Math.min(pl.maxhp,pl.hp+2);sfx('heart');popup(pl.x,pl.y-14,'+1UP','#ff6070');}
      else if(k.type==='bomb'){pl.bombs=Math.min(30,pl.bombs+1);sfx('heart');popup(pl.x,pl.y-14,'+BOMB','#ffd060');}
      else if(k.type==='crystal'){winGame();}}}
  ar.pickups=ar.pickups.filter(k=>k.life>0);
  for(const q of ar.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;q.vx*=0.97;}ar.parts=ar.parts.filter(q=>q.life>0);
  for(const q of ar.pops){q.y-=22*dt;q.life-=dt;}ar.pops=ar.pops.filter(q=>q.life>0);
  if(pl.x<10&&ar.i>0)goArea(ar.i-1,'R');else if(pl.x>MW*TS-10&&ar.i<AREAS.length-1)goArea(ar.i+1,'L');
  pl.x=clamp(pl.x,6,MW*TS-6);pl.y=clamp(pl.y,6,MH*TS-6);

}

function update(dt){
  G.t+=dt;

  else if(k.type==='crystal'){const b=Math.round(Math.sin(k.t*3)*3);ctx.fillStyle='rgba(120,240,255,0.25)';ctx.fillRect(x-14,y-24+b,28,28);ctx.fillStyle='#1d6a82';ctx.fillRect(x-5,y-18+b,10,16);ctx.fillStyle='#40d0f0';ctx.fillRect(x-4,y-20+b,8,18);ctx.fillRect(x-2,y-24+b,4,4);ctx.fillStyle='#c8ffff';ctx.fillRect(x-2,y-18+b,2,10);}}
function drawBomb(b,sx,sy){const x=Math.round(b.x-sx),y=Math.round(b.y-sy);shadow(x,y+3,8);const flash=b.t<0.5&&Math.floor(G.t*16)%2;disc(x,y-1,5,flash?'#e8333f':'#14141c');ctx.fillStyle='#8a8a9a';ctx.fillRect(x-3,y-4,2,2);ctx.fillStyle=Math.floor(G.t*20)%2?'#ffe04a':'#ff8a2a';ctx.fillRect(x+2,y-8,2,2);}
function drawProj(q,sx,sy){const x=Math.round(q.x-sx),y=Math.round(q.y-sy);if(q.kind==='orb'){disc(x,y,4,'#7a20c0');disc(x,y,3,'#c060ff');ctx.fillStyle='#fff';ctx.fillRect(x-1,y-1,2,2);}else{ctx.fillStyle='#e8e8e0';const f=Math.floor(q.ph)%2;ctx.fillRect(x-3,y-1+f,7,2);ctx.fillRect(x-3,y-2,2,4);ctx.fillRect(x+3,y-2,2,4);}}
function heart(x,y,v){const rowsH=[[1,2],[4,5],[0,6],[0,6],[1,5],[2,4],[3,3]];
  ctx.fillStyle='#14080c';rowsH.forEach(([a,b],j)=>ctx.fillRect(x+a-1,y+j,b-a+3,1));ctx.fillRect(x+2,y+7,3,1);
  const col=v===0?'#4a3040':'#e8333f';ctx.fillStyle=col;rowsH.forEach(([a,b],j)=>{ctx.fillRect(x+a,y+j,b-a+1,1);});
  if(v===1){ctx.fillStyle='#4a3040';rowsH.forEach(([a,b],j)=>{const s=Math.max(a,4);if(s<=b)ctx.fillRect(x+s,y+j,b-s+1,1);});}
  if(v===2){ctx.fillStyle='#ff9aa0';ctx.fillRect(x+1,y+1,1,1);}}
function drawHUD(){
  const p=pl,n=p.maxhp/2;
  for(let i=0;i<n;i++){const v=p.hp>=(i+1)*2?2:p.hp>=i*2+1?1:0;heart(6+(i%8)*9,6+Math.floor(i/8)*9,v);}
  const hy=6+Math.ceil(n/8)*9+1;
  ctx.fillStyle='#14080c';ctx.fillRect(5,hy,34,4);ctx.fillStyle='#3a3a5a';ctx.fillRect(6,hy+1,32,2);ctx.fillStyle=p.dashCd>0?'#6a8ad0':'#60d0ff';ctx.fillRect(6,hy+1,Math.round(32*(1-Math.min(1,p.dashCd/(p.boots?0.35:0.6)))),2);
  if(p.holdA&&p.charge>0.1){ctx.fillStyle='#14080c';ctx.fillRect(5,hy+5,34,4);ctx.fillStyle=p.ready?(Math.floor(G.t*16)%2?'#ffe04a':'#fff'):'#e8a030';ctx.fillRect(6,hy+6,Math.round(32*Math.min(1,p.charge/0.55)),2);}
  let rx=VW-6;
  const item=(label,val,col,btn,bc)=>{const s=String(val);rx-=tw(s)+2;text(s,rx,6,'#fff');rx-=10;disc(rx+4,10,4,col);rx-=0;if(btn){disc(rx+4,22,4,bc);text(btn,rx+2,19,'#fff',1,null);}rx-=8;};
  item('c',p.coins,'#ffd23a');item('p',p.potions,'#60d070','X','#2a60d0');item('b',p.bombs,'#4a4a5a','Y','#d0a020');
  text('LV'+p.lvl,6,VH-12,'#ffe04a');ctx.fillStyle='#14080c';ctx.fillRect(30,VH-12,42,6);ctx.fillStyle='#3a3a5a';ctx.fillRect(31,VH-11,40,4);ctx.fillStyle='#ffe04a';ctx.fillRect(31,VH-11,Math.round(40*p.xp/xpNeed(p.lvl)),4);
  if(ar.banner>0){const al=Math.min(1,ar.banner),w=tw(ar.def.name,1)+16;ctx.globalAlpha=al*0.8;ctx.fillStyle='#10186a';ctx.fillRect(Math.round((VW-w)/2),34,w,16);ctx.globalAlpha=al;ctx.fillStyle='#fff';ctx.fillRect(Math.round((VW-w)/2),34,w,1);ctx.fillRect(Math.round((VW-w)/2),49,w,1);textC(ar.def.name,38,'#ffe04a',1);ctx.globalAlpha=1;}
  const b=ar.bossOn?ar.enemies.find(e=>e.type==='boss'&&!e.dead):null;
  if(b){ctx.fillStyle='#14080c';ctx.fillRect(60,VH-26,200,10);ctx.fillStyle='#4a1030';ctx.fillRect(62,VH-24,196,6);ctx.fillStyle='#e8333f';ctx.fillRect(62,VH-24,Math.round(196*Math.max(0,b.hp)/b.maxhp),6);ctx.fillStyle='#ff8090';ctx.fillRect(62,VH-24,Math.round(196*Math.max(0,b.hp)/b.maxhp),2);textC('ZORATH',VH-38,'#ff8090',1);}
  G.toasts.forEach((t,i)=>{const y=VH-44-(G.toasts.length-1-i)*14;const w=tw(t.t)+12;ctx.globalAlpha=Math.min(1,t.life*2);ctx.fillStyle='#10186a';ctx.fillRect(Math.round((VW-w)/2),y-3,w,13);ctx.fillStyle='#fff';ctx.fillRect(Math.round((VW-w)/2),y-3,w,1);ctx.fillRect(Math.round((VW-w)/2),y+9,w,1);textC(t.t,y,'#fff',1);ctx.globalAlpha=1;});
}
function panel(x,y,w,h){ctx.fillStyle='#fff';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#10186a';ctx.fillRect(x,y,w,h);ctx.fillStyle='#2a40b0';ctx.fillRect(x,y,w,h/2);ctx.fillStyle='#1830a0';ctx.fillRect(x,y+h/2,w,h/2);ctx.fillStyle='#000';ctx.fillRect(x-2,y-2,1,1);}
function drawWorld(){
  let sx=cam.x,sy=cam.y;if(G.shakeT>0){sx+=Math.round(rr(-1,1)*G.shakeT);sy+=Math.round(rr(-1,1)*G.shakeT);}
  drawTiles(sx,sy);
  for(const k of ar.pickups)drawPickup(k,sx,sy);
  const list=[];
  for(const e of ar.enemies)if(!e.dead)list.push([e.y+(e.fly?-20:0),()=>drawEnemy(e,sx,sy)]);
  for(const n of ar.npcs)list.push([n.y,()=>drawNpc(n,sx,sy)]);
  for(const b of ar.bombs)list.push([b.y,()=>drawBomb(b,sx,sy)]);
  if(!pl.dead)list.push([pl.y,()=>drawPlayer(sx,sy)]);
  list.sort((a,b)=>a[0]-b[0]);for(const l of list)l[1]();
  for(const q of ar.projs)drawProj(q,sx,sy);
  for(const q of ar.parts){const a=clamp(q.life/q.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=q.col;ctx.fillRect(Math.round(q.x-sx),Math.round(q.y-sy),q.sz,q.sz);}
  ctx.globalAlpha=1;
  for(const q of ar.pops){ctx.globalAlpha=clamp(q.life*2,0,1);text(q.t,Math.round(q.x-sx-tw(q.t)/2),Math.round(q.y-sy),q.col);}
  ctx.globalAlpha=1;
  const th=ar.def.theme;
  if(th>=2){ctx.drawImage(DARK,Math.round(pl.x-sx-320),Math.round(pl.y-sy-240-8));}
  else if(th===1){ctx.fillStyle='rgba(255,170,60,0.07)';ctx.fillRect(0,0,VW,VH);}
  else if(ar.i===1){ctx.fillStyle='rgba(0,40,30,0.08)';ctx.fillRect(0,0,VW,VH);}
  if(ar.flashT>0){ctx.globalAlpha=ar.flashT*5;ctx.fillStyle='#fff';ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;}
  if(pl.hp<=2&&pl.hp>0&&Math.floor(G.t*3)%2){ctx.strokeStyle='rgba(255,0,0,0.5)';ctx.lineWidth=3;ctx.strokeRect(1,1,VW-2,VH-2);}
}
function drawDialog(){const d=G.dlg;panel(10,172,300,60);if(d.name){ctx.fillStyle='#fff';ctx.fillRect(14,163,tw(d.name)+10,12);ctx.fillStyle='#10186a';ctx.fillRect(15,164,tw(d.name)+8,10);text(d.name,19,166,'#ffe04a',1,null);}
  const full=d.lines[d.i],L=wrap(full,44);let left=Math.floor(d.ch);L.forEach((ln,i)=>{const s=ln.slice(0,Math.max(0,left));left-=ln.length+1;text(s,20,180+i*11,'#fff');});
  if(d.ch>=full.length&&Math.floor(G.t*3)%2){ctx.fillStyle='#ffe04a';ctx.fillRect(296,222,6,2);ctx.fillRect(297,224,4,1);ctx.fillRect(298,225,2,1);}}
function drawShop(){const s=G.shop;panel(40,28,240,176);textC('SHOP',36,'#ffe04a',2);text('COINS: '+pl.coins,52,60,'#ffd23a');
  s.items.forEach((it,i)=>{const sel=i===s.sel,y=76+i*18;if(sel){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(48,y-3,224,14);}text((sel?'> ':'  ')+it.n,54,y,sel?'#ffe04a':'#fff');if(it.f){const t=it.c+' C';text(t,264-tw(t),y,pl.coins>=it.c?'#ffd23a':'#ff6070');}});
  if(s.msg)textC(s.msg,176,'#60ff80',1);textC('A: BUY   B: EXIT',190,'#b8c4ff',1);}
function drawMenuItems(m,y0,sp){m.items.forEach((it,i)=>{let s=typeof it.l==='function'?it.l():it.l;if(it.slider)s+=': '+Math.round(it.slider.get()*100)+'%';if(it.tog)s+=': '+(it.tog.get()?'ON':'OFF');
  const dis=it.dis&&it.dis(),sel=i===m.sel,col=dis?'#6a6a7a':sel?(Math.floor(G.t*6)%2?'#ffe04a':'#fff'):'#b8c4ff';textC(sel?'> '+s+' <':s,y0+i*sp,col,1);});}
const STARS=[];{const r=mulberry32(99);for(let i=0;i<70;i++)STARS.push([r()*VW,r()*120,r()]);}
function ridge(base,amp,f,seed,col,sc){ctx.fillStyle=col;for(let x=0;x<VW;x+=2){const h=base+Math.sin((x+sc)*f+seed)*amp+Math.sin((x+sc)*f*2.3+seed*2)*amp*0.4;ctx.fillRect(x,Math.round(h),2,VH);}}
function drawTitleBG(){
  const bands=['#0a0824','#10103a','#181650','#241a62','#3a2072','#5a2a80','#8a3a84','#c0506a'];
  for(let i=0;i<bands.length;i++){ctx.fillStyle=bands[i];ctx.fillRect(0,i*19,VW,20);}
  for(const [x,y,t] of STARS){if(Math.floor(G.t*2+t*9)%3){ctx.fillStyle=t>0.7?'#fff':'#a8b0ff';ctx.fillRect(Math.round(x),Math.round(y),1,1);}}
  disc(248,48,13,'#f4f0c8');disc(252,45,11,'#fffce0');
  const sc=G.t*6;ridge(150,12,0.02,1,'#3a2a66',sc*0.2);
  ctx.fillStyle='#2a1c4c';ctx.fillRect(200,100,6,40);ctx.fillRect(194,112,18,28);ctx.fillRect(188,118,8,22);ctx.fillRect(210,116,8,24);ctx.fillRect(220,110,6,30);ctx.fillRect(226,120,10,20);
  ctx.fillStyle='#ffe04a';ctx.fillRect(199,118,2,3);ctx.fillRect(204,124,2,3);ctx.fillRect(215,124,2,3);ctx.fillRect(223,118,2,3);
  ridge(172,8,0.035,2,'#241848',sc*0.5);ridge(196,6,0.05,3,'#180f34',sc);
  for(let i=0;i<9;i++){const x=((i*48-sc*2)%380+380)%380-30;ctx.fillStyle='#0c0820';ctx.fillRect(Math.round(x),196,4,40);ctx.fillRect(Math.round(x)-6,200,16,12);ctx.fillRect(Math.round(x)-4,190,12,12);}
  ctx.fillStyle='#0c0820';ctx.fillRect(0,224,VW,16);
  for(let i=0;i<4;i++){const x=((i*110+G.t*14)%420)-60;ctx.globalAlpha=0.35;ctx.fillStyle='#e0b0d0';ctx.fillRect(Math.round(x),40+i*14,44,5);ctx.fillRect(Math.round(x)+8,36+i*14,24,5);ctx.globalAlpha=1;}
}
function drawTitle(){
  drawTitleBG();
  const t='PIXEL QUEST';for(let i=0;i<t.length;i++){const y=22+Math.round(Math.sin(G.t*2.5+i*0.6)*3);text(t[i],Math.round((VW-tw(t,4))/2+i*24),y,'#fff',4,'#000');ctx.save();ctx.beginPath();ctx.rect(0,y+14,VW,30);ctx.clip();text(t[i],Math.round((VW-tw(t,4))/2+i*24),y,'#ffb02a',4,null);ctx.restore();}
  textC('CRYSTAL OF ZORATH',66,'#8ae0ff',2);
  if(G.phase===0){if(Math.floor(G.t*2)%2)textC('PRESS START',150,'#fff',2);textC(IN.pad?'* CONTROLLER CONNECTED *':'PLUG IN YOUR XBOX 360 CONTROLLER',182,IN.pad?'#60ff80':'#b8c4ff',1);textC('A / START / ENTER',198,'#8a90c0',1);}
  else if(G.menu){drawMenuItems(G.menu,122,16);textC(IN.pad?'* CONTROLLER CONNECTED *':'KEYBOARD MODE',200,IN.pad?'#60ff80':'#8a90c0',1);}
  textC('(C) PIXEL SOFT 2026',226,'#6a70a0',1);
}
function drawControls(){
  ctx.fillStyle='#0c1038';ctx.fillRect(0,0,VW,VH);for(let y=0;y<VH;y+=4){ctx.fillStyle='#141a50';ctx.fillRect(0,y,VW,1);}
  textC('CONTROLS',10,'#ffe04a',2);
  const rowsC=[['LEFT STICK / D-PAD','MOVE','WASD / ARROWS',null,''],['A','ATTACK / TALK / OPEN (HOLD=SPIN)','J / Z / SPACE','#2aa03a','A'],['B','DASH (DODGE)','K / X / SHIFT','#d03030','B'],['X','USE POTION','L / C','#2a60d0','X'],['Y','DROP BOMB','I / V','#d0a020','Y'],['START','PAUSE / MENU','ENTER / ESC',null,''],['RT / LT / RB / LB','ATTACK / DASH / BOMB / POTION','',null,'']];
  text('XBOX 360 PAD',20,34,'#8ae0ff');text('KEYBOARD',226,34,'#8ae0ff');
  rowsC.forEach((r,i)=>{const y=50+i*22;if(r[3]){disc(28,y+3,6,r[3]);text(r[4],26,y,'#fff',1,null);}else text('*',26,y,'#8ae0ff');text(r[0].length>6&&r[3]===null?r[0]:'',40,y,'#fff');text(r[1],40,r[0].length>6&&r[3]===null?y+9:y,'#ffe04a');text(r[2],226,y,'#b8c4ff');});
  textC('BOMB CRACKED BOULDERS FOR SECRETS!',212,'#60ff80',1);textC('PRESS A OR B TO GO BACK',226,'#b8c4ff',1);
}
function drawWin(){drawTitleBG();ctx.fillStyle='rgba(0,0,20,0.5)';ctx.fillRect(0,0,VW,VH);
  text2('VICTORY!',24,'#ffffff','#ffb02a',4);textC('THE CRYSTAL OF ZORATH IS YOURS',72,'#8ae0ff',1);textC('WILLOWBROOK IS SAVED, HERO!',86,'#fff',1);
  const m=Math.floor(G.time/60),s=Math.floor(G.time%60);
  textC('TIME: '+m+':'+(s<10?'0':'')+s,112,'#ffe04a',1);textC('FOES DEFEATED: '+G.kills,126,'#ffe04a',1);textC('COINS: '+pl.coins+'   LEVEL: '+pl.lvl,140,'#ffe04a',1);textC('MAX HEARTS: '+(pl.maxhp/2),154,'#ff6070',1);
  if(G.winT>2&&Math.floor(G.t*2)%2)textC('PRESS START',190,'#fff',2);}
function drawGameOver(){drawWorld();const a=Math.min(0.8,G.goT*0.6);ctx.fillStyle='rgba(60,0,0,'+a+')';ctx.fillRect(0,0,VW,VH);if(G.goT>0.4)text2('GAME OVER',50,'#ff4050','#a00020',4);if(G.menu)drawMenuItems(G.menu,130,18);}
function render(){
  ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);
  switch(G.state){
    case 'title':drawTitle();break;
    case 'controls':drawControls();break;
    case 'win':drawWin();break;
    case 'gameover':drawGameOver();break;
    default:if(ar){drawWorld();drawHUD();
      if(G.state==='dialog')drawDialog();
      if(G.state==='shop')drawShop();
      if(G.state==='paused'&&G.menu){ctx.fillStyle='rgba(0,0,30,0.65)';ctx.fillRect(0,0,VW,VH);panel(80,50,160,140);textC(G.menu.title||'',58,'#ffe04a',2);drawMenuItems(G.menu,90,16);textC(IN.pad?'PAD OK':'KEYBOARD',178,'#8a90c0',1);}
    }
  }
  if(G.fade){const a=G.fade.mode==='out'?G.fade.t/0.25:1-G.fade.t/0.25;ctx.globalAlpha=clamp(a,0,1);ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;}
  if(settings.scan)ctx.drawImage(SCAN,0,0);
}

/* ===================== MAIN LOOP ===================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,Math.max(0,(now-last)/1000));last=now;
  try{pollInput(dt);update(dt);render();}catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
