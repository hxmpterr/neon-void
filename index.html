function bg(w,h,cx,cy){const hz=h*.5,bh=hz/7;['#0a0620','#120a30','#1c0e42','#2b1257','#421a6b','#6a2377','#a03a7d'].forEach((q,i)=>px(0,i*bh,w,bh+1,q));

g.fillStyle='#ffd6a0';g.beginPath();g.arc(w*.75-cx*.3,hz*.45-cy*.2,h*.09,0,6.3);g.fill();px(w*.75-cx*.3-h*.08,hz*.45-cy*.2+3,h*.16,2,'#e9a26c');
[[.5,'#2a1448',.12,.2],[1,'#1a0c30',.03,.28]].forEach(([d,co,off,amp],L)=>{g.fillStyle=co;g.beginPath();g.moveTo(0,hz+2);for(let x=0;x<=w;x+=8)g.lineTo(x,hz*(1-off)-Math.abs(Math.sin((x+cx*d*1.5+L*50)*.03)*hz*amp+Math.sin((x+cx*d*1.5)*.09)*hz*.08));g.lineTo(w,hz+2);g.fill()});
px(0,hz,w,h-hz+1,'#0b0618');g.strokeStyle='#8a2be2';g.globalAlpha=.6;
for(let i=0;i<8;i++){const y=hz+Math.pow(mod(i-cy*.03,8)/8,2)*(h-hz);g.beginPath();g.moveTo(0,y|0);g.lineTo(w,y|0);g.stroke()}
for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(w/2+i*6-cx*.3,hz);g.lineTo(w/2+i*40-cx*1.2,h);g.stroke()}g.globalAlpha=1}

if(e.ty==0){px(x-4,y-3,8,7,f?'#fff':'#4d4');px(x-3,y-4,6,1,f?'#fff':'#6f6');px(x-2,y-1,2,2,'#000');px(x+1,y-1,2,2,'#000')}
if(e.ty==1){const w=Math.sin(e.t*5)*3|0;px(x-1,y-2,3,5,f?'#fff':'#c6f');px(x-6,y-2-w,5,2,f?'#fff':'#92d');px(x+2,y-2-w,5,2,f?'#fff':'#92d');px(x-1,y-1,1,1,'#ff0');px(x+1,y-1,1,1,'#ff0')}
if(e.ty==2){px(x-8,y-7,16,15,f?'#fff':'#c63');px(x-6,y-5,12,4,f?'#fff':'#f84');px(x-4,y-3,2,2,'#000');px(x+2,y-3,2,2,'#000')}

if(e.ty==3){const w=Math.sin(e.t*2)*2|0;px(x-14,y-12+w,28,24,f?'#fff':'#a2a');px(x-10,y-8+w,20,8,f?'#fff':'#f3a');px(x-7,y-6+w,4,4,'#ff0');px(x+3,y-6+w,4,4,'#ff0');px(x-12,y+4+w,24,3,'#505');px(x-14,y-18,28,3,'#222');px(x-14,y-18,28*e.hp/e.mh,3,'#f33')}}
function world(){g.fillStyle='#1a0a3066';g.fillRect(0,0,WW,WH);g.strokeStyle='#5a2a9a55';for(let x=0;x<=WW;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,WH);g.stroke()}for(let y=0;y<=WH;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(WW,y);g.stroke()}
g.strokeStyle='#f0f';g.lineWidth=2;g.strokeRect(0,0,WW,WH);g.lineWidth=1;
gm.forEach(q=>px(q.x-2,q.y-2+Math.sin(T*.2+q.x)*1.5,4,4,q.l<90&&(T>>2)&1?'#fff':'#4fc'));
pu.forEach(q=>{const co=['#f55','#fd3','#8ff','#f8f','#aaf','#8f8','#fa6'][q.ty],y=q.y+Math.sin(T*.1)*2;px(q.x-4,y-4,8,8,co);px(q.x-2,y-2,4,4,'#fff')});
en.forEach(drawEn);eb.forEach(b=>{px(b.x-2,b.y-2,4,4,'#f3a');px(b.x-1,b.y-1,2,2,'#fff')});bl.forEach(b=>{px(b.x-1,b.y-1,3,3,b.h?'#f84':b.o?PC[b.o]:'#ff6');px(b.x,b.y,1,1,'#fff')});
ps.forEach(p=>{if(p.dead){px(p.x-4,p.y+2,8,3,'#555');return}const x=p.x|0,y=p.y|0,C=col(p);

if(!(p.inv>0&&(T>>2)&1&&p.dash<=0)){spr(x,y,C,p.fx,p.fy,p.dash>0);if(p.shield>0){g.strokeStyle='#8ff';g.beginPath();g.arc(x,y,11+Math.sin(T*.3),0,6.3);g.stroke()}}
if(p.ob>0)for(let k=0;k<3;k++)px(x+Math.cos(T*.1+k*2.09)*24-2,y+Math.sin(T*.1+k*2.09)*24-2,5,5,'#fa6');
if(np>1)tx((p.bot?'CPU':'P'+(p.i+1)),x,y-10,C,'center')});
pt.forEach(q=>px(q.x,q.y,2,2,q.col));ft.forEach(f=>tx(f.s,f.x,f.y,'#ff8','center'))}
function view(i,x,y,w,h){const p=ps[i];g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x,y);
const cx=Math.max(0,Math.min(WW-w,p.x-w/2+Math.sin(T*.012)*6)),cy=Math.max(0,Math.min(WH-h,p.y-h/2+Math.cos(T*.009)*3));
bg(w,h,cx,cy);g.translate(-(cx|0),-(cy|0));world();g.translate(cx|0,cy|0);

tx((np>1?(p.bot?'CPU ':'P'+(i+1)+' '):'')+p.sc,w-4,fs+2,'#fff','right');if(p.combo>1)tx('x'+p.combo,w-4,fs*2+4,'#fc4','right');
px(4,h<100?12:14,40,3,'#222');px(4,h<100?12:14,p.ch*4,3,p.ch>=10?(T>>3&1?'#fff':'#ff0'):'#fa3');
let st=[];if(p.wt>0)st.push(['','SPREAD','LASER','HOMING'][p.wp]);if(p.rapid>0)st.push('RAPID');if(p.mg>0)st.push('MAGNET');if(p.ob>0)st.push('ORBIT');if(frz>0)st.push('FREEZE');tx(st.join(' '),4,h-5,'#f8f');
if(p.dead)tx('DOWN - back next wave',w/2,h/2,'#f66','center');if(i==0||np==1)tx('WAVE '+wave+(wave%5==0?' BOSS':''),w/2,fs+2,'#8cf','center');fs=10;g.restore()}
function draw(){g.save();if(shake>0){g.translate(Math.random()*shake-shake/2|0,Math.random()*shake-shake/2|0);shake*=.85;if(shake<.5)shake=0}
if(state=='menu'||state=='shop'){bg(320,180,Math.sin(T*.012)*14,Math.cos(T*.009)*6);

else{['START GAME','PLAYERS: '+S.np,'DIFFICULTY: '+DN[S.d],'AIM: '+AN[S.aim],'FRIENDLY FIRE: '+(S.ff?'ON':'OFF'),'SOUND: '+(mute?'OFF':'ON'),'SHOP','CONTROLS'].forEach((s,i)=>tx((sel==i?'> ':'  ')+s+(sel==i?' <':''),160,62+i*12,sel==i?'#ff0':'#aaa','center'));
tx('BEST '+best+'  COINS '+SV.coins,160,172,'#8cf','center')}}
else{px(8,8,304,164,'#000d');tx('SHOP',16,22,'#ff0');tx('COINS '+SV.coins,304,22,'#fd3','right');fs=8;
SK.forEach((s,i)=>{const o=SV.owned.includes(i);tx((sel==i?'> ':'  ')+s[0]+'  '+(SV.eq==i?'[EQUIPPED]':o?'owned':s[2]+'c'),20,38+i*10,sel==i?'#ff0':o?'#fff':'#999')});
UP.forEach((s,i)=>{const L=SV.up[i];tx((sel==8+i?'> ':'  ')+s+' Lv'+L+'/5  '+(L>=5?'MAX':40*(L+1)+'c'),20,122+i*10,sel==8+i?'#ff0':'#fff')});tx((sel==12?'> ':'  ')+'BACK',20,166,sel==12?'#ff0':'#aaa');fs=10;
g.save();g.translate(240,90);g.scale(4,4);spr(0,0,skc(sel<8?sel:SV.eq),Math.sin(T*.05),0);g.restore();tx(SK[sel<8?sel:SV.eq][0],240,140,'#fff','center')}}
else if(ps.length){const L=np==1?[[0,0,320,180]]:np==2?[[0,0,158,180],[162,0,158,180]]:[[0,0,158,88],[162,0,158,88],[0,92,158,88],[162,92,158,88]];
L.forEach((r,i)=>{if(ps[i])view(i,...r);else px(r[0],r[1],r[2],r[3],'#0a0620')});

g.restore();for(let y=0;y<180;y+=2){g.fillStyle='#0003';g.fillRect(0,y,320,1)}
